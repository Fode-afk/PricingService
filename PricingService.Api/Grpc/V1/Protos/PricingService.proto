syntax = "proto3";

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";

package pricing.v1;

option csharp_namespace = "PricingService.Api.Grpc.V1.Protos";

service PricingService {
	rpc CreatePrice(CreatePriceRequest) returns (google.protobuf.Empty);
    rpc UpdatePrice(UpdatePriceRequest) returns (google.protobuf.Empty);

    rpc GetPriceHistory(GetPriceHistoryRequest) returns (GetPriceHistoryResponse);
    rpc GetScheduledPrice(GetScheduledPriceRequest) returns (GetScheduledPriceResponse);
}

message CreatePriceRequest {
    string product_variant_id = 1;
    string vendor_id = 2; 
    int64 base_price_minor = 3;
    string currency_code = 4;
    google.protobuf.Timestamp effective_from = 5;
}

message UpdatePriceRequest {
    string vendor_id = 1;
    string product_variant_id = 2;
    int64 new_price_minor = 3;
    string currency_code = 4;
    google.protobuf.Timestamp effective_from = 5;
    google.protobuf.Timestamp effective_to = 6;
}

message PriceHistoryEntryDto {
    int64 price_minor = 1;
    string reason = 2;
    string reason_note = 3;
    string changed_by = 4;
    string source = 5;
}

message GetPriceHistoryRequest {
    string product_variant_id = 1;
    string vendor_id = 2;
    google.protobuf.Timestamp from = 3;
    google.protobuf.Timestamp to = 4;
    int32 page = 5;
    int32 page_size = 6;
    string currency_code = 7;
}

message GetPriceHistoryResponse {
    repeated PriceHistoryEntryDto entries = 1;
    int32 total_count = 2;
    int32 page_number = 3;
    int32 page_size = 4;
    int32 total_pages = 5;
}

message ScheduledPriceDto {
    int64 price_minor = 1;
    google.protobuf.Timestamp effective_from = 3;
    google.protobuf.Timestamp effective_to = 4;
}

message GetScheduledPriceRequest {
    string product_variant_id = 1;
    string vendor_id = 2;
    google.protobuf.Timestamp at = 3;
    string currency_code = 4;
}

message GetScheduledPriceResponse {
    ScheduledPriceDto scheduled_price = 1;
}