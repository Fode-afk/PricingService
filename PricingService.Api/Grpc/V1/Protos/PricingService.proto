syntax = "proto3";

import "google/protobuf/timestamp.proto";

package pricing.v1;

option csharp_namespace = "PricingService.Api.Grpc.V1.Protos";

service PricingService {
	rpc CreatePrice(CreatePriceRequest) returns (PriceStateResponse);
    rpc UpdatePrice(UpdatePriceRequest) returns (PriceStateResponse);

    rpc GetPriceHistory(GetPriceHistoryRequest) returns (GetPriceHistoryResponse);
    rpc GetNextScheduledPrice(GetNextScheduledPriceRequest) returns (GetNextScheduledPriceResponse);
    rpc GetVariantPrices(GetVariantPricesRequest) returns (GetVariantPricesResponse);
}

message CreatePriceRequest {
    string product_variant_id = 1;
    string vendor_id = 2; 
    int64 base_price_minor = 3;
    string currency_code = 4;
}

message UpdatePriceRequest {
    string product_variant_id = 1;
    string vendor_id = 2;
    int64 new_price_minor = 3;
    string currency_code = 4;
    optional string effective_from = 5;
    optional string effective_to = 6;
}

message PriceHistoryEntryDto {
    int64 price_minor = 1;
    string reason = 2;
    string reason_note = 3;
    string changed_by = 4;
    string source = 5;
}

message GetPriceHistoryRequest {
    string product_variant_id = 1;
    string vendor_id = 2;
    optional string from = 3;
    optional string to = 4;
    int32 page = 5;
    int32 page_size = 6;
    string currency_code = 7;
}

message GetPriceHistoryResponse {
    repeated PriceHistoryEntryDto entries = 1;
    int32 total_count = 2;
    int32 page_number = 3;
    int32 page_size = 4;
    int32 total_pages = 5;
}

message GetNextScheduledPriceRequest {
    string product_variant_id = 1;
    string vendor_id = 2;
    string currency_code = 3;
}

message GetNextScheduledPriceResponse {
    PriceEntryDto scheduled_price = 1;
}

message GetVariantPricesRequest {
    string product_variant_id = 1;
    string vendor_id = 2;
}

message GetVariantPricesResponse {
    repeated VariantPriceDto variant_prices = 1;
}

message VariantPriceDto {
    string currency_code = 1;
    bool is_base = 2;
    int64 current_price_minor = 3;
}

message PriceEntryDto {
    int64 price_minor = 1;
    string currency_code = 2;
    google.protobuf.Timestamp effective_from = 3;
    google.protobuf.Timestamp effective_to = 4;
}

message PriceStateResponse {
    PriceEntryDto current = 1;
    PriceEntryDto next_scheduled = 2;
}